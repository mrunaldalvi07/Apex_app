name: apex_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.0

  # Google Authentication
  google_sign_in: ^7.2.0

  # File and document handling
  file_picker: ^12.0.0
  open_file: ^4.0.0
  excel: ^4.0.6
  path_provider: ^2.1.6

  # Sharing and location
  share_plus: ^13.3.0
  geolocator: ^14.0.2

  # Local notifications
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true