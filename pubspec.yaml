name: apex_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.0
  google_sign_in: ^7.2.0

  # Notifications
  flutter_local_notifications: ^22.2.0

  # File handling
  file_picker: ^11.0.2
  open_file: ^3.5.10

  # Excel / File export
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^12.0.2

  # Location
  geolocator: ^14.0.2
  printing: ^5.14.3
  pdf: ^3.12.0
  google_sign_in_android: 7.2.16

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
